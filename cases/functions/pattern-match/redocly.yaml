# Native Redocly equivalent of ruleset.yaml: Redocly CLI cannot read
# Spectral/OpenLint rulesets, so this expresses the same rule intent.
extends: []
rules:
  rule/op-id-camel:
    subject:
      type: Operation
      property: operationId
    assertions:
      pattern: /^[a-z][a-zA-Z0-9]*$/
    severity: error
