name: Conformance

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openlint/spec
          path: spec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run tools
      - name: Install Insomnia inso (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api 'repos/Kong/insomnia/releases?per_page=20' --jq '[.[] | select(.prerelease == false) | .assets[] | select(.name | test("^inso-linux-x64-.*\\.tar\\.xz$"))][0].browser_download_url')
          curl -sL "$url" | tar -xJ -C node_modules/.bin
      - run: npm test
      - name: Build site
        run: cp results/matrix.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
